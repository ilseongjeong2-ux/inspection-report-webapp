<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>검사성적서</title>
<style>
  :root {
    --page-bg: #f4f5f7;
    --card-bg: #ffffff;
    --line: #1f2937;
    --border: #444a54;
    --label-bg: #eef1f7;
    --text: #1f2937;
    --text-muted: #6b7280;
    --pass: #16a34a;
    --pass-bg: #dcfce7;
    --fail: #dc2626;
    --fail-bg: #fee2e2;
    --cond: #d97706;
    --cond-bg: #fef3c7;
    --primary: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--page-bg);
    color: var(--text);
  }
  .toolbar {
    max-width: 760px;
    margin: 0 auto;
    padding: 18px 20px 0;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .btn {
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: var(--primary);
    color: #fff;
  }
  .btn-secondary { background: #fff; color: var(--text); border: 1px solid #9ca3af; }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .sheet {
    max-width: 760px;
    margin: 16px auto 40px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 30px 36px 24px;
  }
  .title {
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    margin: 0 0 14px;
    padding-bottom: 14px;
    border-bottom: 3px solid var(--line);
  }
  table.cert { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.cert th, table.cert td {
    border: 1px solid var(--border);
    padding: 10px 14px;
    font-size: 14px;
    text-align: center;
    vertical-align: middle;
  }
  table.cert th {
    background: var(--label-bg);
    font-weight: 700;
    text-align: center;
    white-space: nowrap;
  }
  td.small { white-space: nowrap; }
  td.center { text-align: center; }
  td.verdict { text-align: center; font-weight: 700; }
  td.verdict.적합 { background: var(--pass-bg); color: var(--pass); }
  td.verdict.부적합 { background: var(--fail-bg); color: var(--fail); }
  td.verdict.조건부적합 { background: var(--cond-bg); color: var(--cond); }
  td.criteria { white-space: pre-line; text-align: center; line-height: 1.6; }
  td.prelines { white-space: pre-line; text-align: center; line-height: 1.6; }
  td.remark { font-weight: 700; color: var(--fail); }
  .result-line .picked { font-weight: 800; font-size: 15px; }
  .result-line .picked.적합 { color: var(--pass); }
  .result-line .picked.부적합 { color: var(--fail); }
  .result-line .picked.조건부적합 { color: var(--cond); }
  td.photo-cell { min-height: 140px; }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .photos img { width: 100%; height: 140px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); cursor: pointer; }
  .no-content { min-height: 40px; }
  .logo { text-align: right; margin-top: 14px; }
  .logo img { height: 20px; }
  .empty-note { font-size: 13px; color: var(--text-muted); font-style: italic; }
  .empty { text-align: center; color: var(--text-muted); padding: 60px 20px; }
  table.cert td.item-no { width: 40px; }
  .section-gap { height: 18px; }
  .item-section-title {
    font-size: 14px; font-weight: 700; text-align: left;
    padding: 8px 12px; background: var(--label-bg);
    border: 1px solid var(--border); border-bottom: none;
  }
  .item-section-title .picked { margin-left: 8px; }

  .lightbox-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 200; flex-direction: column; }
  .lightbox-overlay.open { display: flex; }
  .lightbox-overlay img { max-width: 90vw; max-height: 80vh; border-radius: 8px; transform-origin: center; transition: transform 0.05s ease-out; }
  .lightbox-nav { display: flex; gap: 20px; margin-top: 16px; align-items: center; color: #fff; }
  .lightbox-nav button { background: rgba(255,255,255,0.15); color: #fff; border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 14px; }
  .lightbox-close { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 28px; cursor: pointer; background: none; border: none; }

  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .sheet { border: none; margin: 0; padding: 0; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button class="btn btn-secondary" onclick="window.print()">인쇄</button>
  <button class="btn" onclick="downloadPdf(this)">PDF 저장</button>
</div>

<div class="sheet" id="sheet">
  <div class="empty">불러오는 중...</div>
</div>

<div class="lightbox-overlay" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <img id="lightboxImg" src="" />
  <div class="lightbox-nav">
    <button onclick="lightboxPrev()">‹ 이전</button>
    <span id="lightboxCount"></span>
    <button onclick="lightboxNext()">다음 ›</button>
  </div>
</div>

<script src="vendor/html2canvas.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  let currentRecord = null;

  async function downloadPdf(btn) {
    btn.disabled = true;
    const prevText = btn.textContent;
    btn.textContent = '생성 중...';
    try {
      const sheet = document.getElementById('sheet');
      const canvas = await html2canvas(sheet, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
      const imgData = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const pageWidthMM = 210;
      const pageHeightMM = (canvas.height * pageWidthMM) / canvas.width;
      const pdf = new jsPDF({
        orientation: pageHeightMM >= pageWidthMM ? 'p' : 'l',
        unit: 'mm',
        format: [pageWidthMM, pageHeightMM]
      });
      pdf.addImage(imgData, 'PNG', 0, 0, pageWidthMM, pageHeightMM);
      const fileName = currentRecord?.inspectionNo ? `검사성적서_${currentRecord.inspectionNo}.pdf` : '검사성적서.pdf';
      pdf.save(fileName);
    } catch (err) {
      alert('PDF 생성 실패: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = prevText;
    }
  }

  async function load() {
    const sheet = document.getElementById('sheet');
    if (!id) {
      sheet.innerHTML = '<div class="empty">문서 ID가 없습니다.</div>';
      return;
    }
    try {
      const res = await fetch('data.json?t=' + Date.now());
      if (!res.ok) throw new Error('데이터를 불러오지 못했습니다.');
      const payload = await res.json();
      const list = Array.isArray(payload) ? payload : (payload.records || []);
      const r = list.find(x => x.id === id);
      if (!r) throw new Error('문서를 찾을 수 없습니다.');
      render(r);
    } catch (err) {
      sheet.innerHTML = `<div class="empty">${err.message}</div>`;
    }
  }

  function resultLine(result) {
    return `<span class="picked ${result}">${result || ''}</span>`;
  }

  let photoGroups = {};
  let lightboxGroup = null;
  let lightboxIndex = 0;

  function photoGrid(urls, groupKey) {
    photoGroups[groupKey] = urls;
    return urls.length
      ? `<div class="photos">${urls.map((p, i) => `<img src="${p}" onclick="openLightbox('${groupKey}', ${i})" />`).join('')}</div>`
      : '<div class="empty-note">등록된 사진이 없습니다.</div>';
  }

  function openLightbox(groupKey, index) {
    lightboxGroup = groupKey;
    lightboxIndex = index;
    updateLightboxImg();
    document.getElementById('lightbox').classList.add('open');
  }
  let lightboxScale = 1;
  let panX = 0, panY = 0;
  let isDragging = false, dragStartX = 0, dragStartY = 0, panStartX = 0, panStartY = 0;

  function applyLightboxTransform() {
    const img = document.getElementById('lightboxImg');
    img.style.transform = `translate(${panX}px, ${panY}px) scale(${lightboxScale})`;
    img.style.cursor = lightboxScale > 1 ? (isDragging ? 'grabbing' : 'grab') : 'zoom-in';
  }
  function updateLightboxImg() {
    const urls = photoGroups[lightboxGroup] || [];
    const img = document.getElementById('lightboxImg');
    img.src = urls[lightboxIndex];
    document.getElementById('lightboxCount').textContent = `${lightboxIndex + 1} / ${urls.length}`;
    lightboxScale = 1;
    panX = 0;
    panY = 0;
    img.style.transformOrigin = 'center center';
    applyLightboxTransform();
  }
  function lightboxPrev() {
    const urls = photoGroups[lightboxGroup] || [];
    lightboxIndex = (lightboxIndex - 1 + urls.length) % urls.length;
    updateLightboxImg();
  }
  function lightboxNext() {
    const urls = photoGroups[lightboxGroup] || [];
    lightboxIndex = (lightboxIndex + 1) % urls.length;
    updateLightboxImg();
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
  }

  const lightboxImgEl = document.getElementById('lightboxImg');
  lightboxImgEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    const img = e.target;
    const rect = img.getBoundingClientRect();
    const originX = ((e.clientX - rect.left) / rect.width) * 100;
    const originY = ((e.clientY - rect.top) / rect.height) * 100;
    img.style.transformOrigin = `${originX}% ${originY}%`;
    lightboxScale += e.deltaY < 0 ? 0.15 : -0.15;
    lightboxScale = Math.min(Math.max(lightboxScale, 1), 5);
    if (lightboxScale <= 1) { panX = 0; panY = 0; }
    applyLightboxTransform();
  }, { passive: false });
  lightboxImgEl.addEventListener('mousedown', (e) => {
    if (lightboxScale <= 1) return;
    e.preventDefault();
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    panStartX = panX;
    panStartY = panY;
    applyLightboxTransform();
  });
  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    panX = panStartX + (e.clientX - dragStartX);
    panY = panStartY + (e.clientY - dragStartY);
    applyLightboxTransform();
  });
  window.addEventListener('mouseup', () => {
    if (!isDragging) return;
    isDragging = false;
    applyLightboxTransform();
  });
  lightboxImgEl.addEventListener('dblclick', () => {
    lightboxScale = 1;
    panX = 0;
    panY = 0;
    lightboxImgEl.style.transformOrigin = 'center center';
    applyLightboxTransform();
  });

  function multiLineRows(label, text) {
    const lines = (text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const value = lines.join('\n');
    // 비고는 눈에 띄도록 굵은 빨간 글씨로 표시한다.
    const remarkClass = label.includes('비고') ? ' remark' : '';
    return `<tr><th>${label}</th><td class="prelines${remarkClass}${lines.length ? '' : ' no-content'}" colspan="3">${value}</td></tr>`;
  }

  function reportItems(r) {
    if (r.items && r.items.length) return r.items;
    return [{
      itemName: r.itemName || '', color: r.color || '', lotNo: r.lotNo || '',
      quantity: r.quantity != null ? r.quantity : null,
      result: r.result || '적합', defectDetail: r.defectDetail || '',
      photoUrls: r.photoUrls || [], defectPhotoUrls: r.defectPhotoUrls || []
    }];
  }

  const CERT_COLGROUP = `
        <colgroup>
          <col style="width: 140px">
          <col style="width: 220px">
          <col style="width: 90px">
          <col>
        </colgroup>`;

  // 업체명 / 문서번호 / 검사일자 / 검사자 / 판정 — 성적서 공통 머리 부분
  function certHeadRows(r, verdictLabel) {
    return `
        <tr>
          <th rowspan="2">업체명</th>
          <td rowspan="2">${r.vendor || ''}</td>
          <th class="small">문서번호</th>
          <td class="small">${r.inspectionNo || ''}</td>
        </tr>
        <tr>
          <th class="small">검사일자</th>
          <td class="small">${r.inspectionDate || ''}</td>
        </tr>
        <tr>
          <th>검사자</th>
          <td>${r.inspector || ''}</td>
          <th class="small">${verdictLabel}</th>
          <td class="small verdict ${r.result}">${r.result || ''}</td>
        </tr>`;
  }

  // 품목이 1개일 때: 기존 성적서 양식을 그대로 유지한다.
  function singleItemSheet(r, item) {
    const itemColor = [item.itemName || '', item.color || ''].filter(Boolean).join(' / ');
    const defectPhotos = item.defectPhotoUrls || [];
    const defectPhotoRow = defectPhotos.length
      ? `<tr><th>불량사진</th><td class="photo-cell" colspan="3">${photoGrid(defectPhotos, 'defects')}</td></tr>`
      : '';
    const defectDetailRow = item.result !== '적합' ? multiLineRows('불량내용', item.defectDetail) : '';
    return `
      <div class="title">검사 성적서</div>
      <table class="cert">${CERT_COLGROUP}
        ${certHeadRows(r, '판정')}
        <tr>
          <th>품목명 / 색상</th>
          <td colspan="3">${itemColor}</td>
        </tr>
        <tr>
          <th>검사항목</th>
          <td class="center" colspan="3">${r.inspectionItem || ''}</td>
        </tr>
        <tr>
          <th>기준</th>
          <td class="criteria" colspan="3">${r.criteria || ''}</td>
        </tr>
        <tr>
          <th>결과</th>
          <td class="center result-line" colspan="3">${resultLine(item.result)}</td>
        </tr>
        ${defectDetailRow}
        <tr>
          <th>사진</th>
          <td class="photo-cell" colspan="3">${photoGrid(item.photoUrls || [], 'photos')}</td>
        </tr>
        ${defectPhotoRow}
        ${item.remarks ? multiLineRows('품목 비고', item.remarks) : ''}
        ${multiLineRows('비고', r.remarks)}
      </table>
      <div class="logo"><img src="fursys-logo.png" alt="FURSYS" /></div>
    `;
  }

  // 품목이 여러 개일 때: 공통 정보 + 품목 목록표 + 품목별 사진/불량내용
  function multiItemSheet(r, items) {
    const itemRows = items.map((item, index) => `
        <tr>
          <td class="item-no">${index + 1}</td>
          <td>${item.itemName || ''}</td>
          <td>${item.color || ''}</td>
          <td>${item.lotNo || ''}</td>
          <td>${item.quantity != null ? item.quantity : ''}</td>
          <td class="verdict ${item.result}">${item.result || ''}</td>
        </tr>`).join('');

    const itemSections = items.map((item, index) => {
      const heading = [item.itemName || '', item.color || ''].filter(Boolean).join(' / ');
      const defectDetailRow = item.result !== '적합' ? multiLineRows('불량내용', item.defectDetail) : '';
      const defectPhotos = item.defectPhotoUrls || [];
      const defectPhotoRow = defectPhotos.length
        ? `<tr><th>불량사진</th><td class="photo-cell" colspan="3">${photoGrid(defectPhotos, 'defects' + index)}</td></tr>`
        : '';
      return `
      <div class="section-gap"></div>
      <div class="item-section-title">품목 ${index + 1}. ${heading}<span class="picked ${item.result}">${item.result || ''}</span></div>
      <table class="cert">${CERT_COLGROUP}
        <tr>
          <th>사진</th>
          <td class="photo-cell" colspan="3">${photoGrid(item.photoUrls || [], 'photos' + index)}</td>
        </tr>
        ${defectDetailRow}
        ${defectPhotoRow}
        ${item.remarks ? multiLineRows('비고', item.remarks) : ''}
      </table>`;
    }).join('');

    return `
      <div class="title">검사 성적서</div>
      <table class="cert">${CERT_COLGROUP}
        ${certHeadRows(r, '종합판정')}
        <tr>
          <th>검사항목</th>
          <td class="center" colspan="3">${r.inspectionItem || ''}</td>
        </tr>
        <tr>
          <th>기준</th>
          <td class="criteria" colspan="3">${r.criteria || ''}</td>
        </tr>
      </table>

      <div class="section-gap"></div>
      <table class="cert">
        <colgroup>
          <col style="width: 40px">
          <col>
          <col style="width: 90px">
          <col style="width: 110px">
          <col style="width: 60px">
          <col style="width: 90px">
        </colgroup>
        <tr>
          <th>No.</th>
          <th>품목명</th>
          <th>색상</th>
          <th>Lot No.</th>
          <th>수량</th>
          <th>판정</th>
        </tr>
        ${itemRows}
      </table>

      ${itemSections}

      <div class="section-gap"></div>
      <table class="cert">${CERT_COLGROUP}
        ${multiLineRows('비고', r.remarks)}
      </table>
      <div class="logo"><img src="fursys-logo.png" alt="FURSYS" /></div>
    `;
  }

  function render(r) {
    currentRecord = r;
    photoGroups = {};
    const items = reportItems(r);
    document.getElementById('sheet').innerHTML = items.length > 1
      ? multiItemSheet(r, items)
      : singleItemSheet(r, items[0]);
  }

  load();
</script>
</body>
</html>
