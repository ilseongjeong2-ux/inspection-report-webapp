<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>검사성적서 조회</title>
<style>
  :root {
    --bg: #f2f4f9;
    --card-bg: #ffffff;
    --border: #e7eaf1;
    --border-strong: #d6dbe5;
    --text: #161a23;
    --text-muted: #7c8494;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-wash: #eaf1ff;
    --pass: #0d9450;
    --pass-bg: #e6f6ee;
    --fail: #d0342c;
    --fail-bg: #fbeaea;
    --cond: #b45309;
    --cond-bg: #fdf3dd;
    --dark: #12161f;
    --dark-2: #1b2130;
    --shadow: 0 1px 2px rgba(15,23,42,0.04);
    --shadow-md: 0 8px 24px rgba(15,23,42,0.08);
    --radius-lg: 14px;
    --radius-md: 10px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 32px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.3px; margin: 0; color: var(--text); white-space: nowrap; }
  .topbar-stats { display: flex; gap: 14px; align-items: center; flex: 1; }
  .stat {
    display: flex; flex-direction: column; line-height: 1.2;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 22px;
  }
  .stat b { font-size: 27px; font-weight: 800; color: var(--text); letter-spacing: -0.4px; }
  .stat span { font-size: 12px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.3px; margin-top: 2px; }
  .stat.stat-pass { background: var(--pass-bg); border-color: rgba(13,148,80,0.25); }
  .stat.stat-pass b { color: var(--pass); }
  .stat.stat-fail { background: var(--fail-bg); border-color: rgba(208,52,44,0.25); }
  .stat.stat-fail b { color: var(--fail); }
  .header-actions { display: flex; gap: 10px; flex-shrink: 0; }
  .btn {
    border: none;
    border-radius: var(--radius-sm);
    padding: 11px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: #fff; color: var(--text); border: 1px solid var(--border-strong); }
  .btn-secondary:hover { background: var(--bg); border-color: var(--primary); }
  main { max-width: 1520px; margin: 0 auto; padding: 24px 28px 44px; }

  .alert-banner { display: flex; align-items: center; gap: 18px; background: var(--primary-wash); border: 1px solid #cfe0fd; border-radius: var(--radius-lg); padding: 15px 20px; margin-bottom: 22px; cursor: pointer; transition: box-shadow 0.15s; }
  .alert-banner:hover { box-shadow: var(--shadow-md); }
  .alert-banner-tag { flex-shrink: 0; font-size: 13px; font-weight: 700; color: var(--primary-dark); background: #fff; border: 1px solid #cfe0fd; padding: 6px 14px; border-radius: 999px; }
  .alert-banner .schedule-list { flex: 1; }
  .alert-banner .btn { flex-shrink: 0; }
  .schedule-list { font-size: 14.5px; max-height: 64px; overflow-y: auto; line-height: 1.6; }
  .schedule-list .schedule-row { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .schedule-list .schedule-row b { font-weight: 700; margin-right: 6px; color: var(--primary-dark); }
  .schedule-list .schedule-more { color: var(--text-muted); font-size: 12.5px; margin-top: 2px; }
  .schedule-list .schedule-empty { color: var(--text-muted); }

  .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 22px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 22px; border-bottom: 1px solid var(--border); }
  .tabs { display: flex; gap: 24px; }
  .tabs button { background: none; border: none; border-bottom: 2px solid transparent; padding: 16px 2px; font-size: 15px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
  .tabs button.active { color: var(--text); border-bottom-color: var(--primary); }

  .filter-bar { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; padding: 18px 22px; border-bottom: 1px solid var(--border); }
  .filter-item { display: flex; flex-direction: column; gap: 6px; }
  .filter-item label { font-size: 14px; font-weight: 700; color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 8px; }
  .date-range { display: flex; align-items: center; gap: 6px; }
  .date-sep { color: var(--text-muted); font-size: 13px; }
  .link-btn {
    background: none; border: none; padding: 0; cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--primary);
  }
  .link-btn:hover { text-decoration: underline; }
  input, select, textarea {
    font-family: inherit;
    padding: 9px 12px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: #fff;
    color: var(--text);
    font-size: 14.5px;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-wash); }

  #galleryView { padding: 20px 22px; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 16px 11px; text-align: center; font-size: 13.5px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: middle; }
  th { background: var(--bg); color: var(--text-muted); font-weight: 700; font-size: 12.5px; letter-spacing: 0.2px; }
  td.num { font-variant-numeric: tabular-nums; }
  td.wrap { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; font-size: 14px; }
  /* 비고는 줄바꿈을 살려 전체를 보여 준다. 너무 길면 4줄까지만 보이고 '더보기'로 펼친다 */
  td.remarks { max-width: 300px; text-align: left; font-size: 12.5px; font-weight: 700; line-height: 1.6; white-space: normal; }
  td.remarks .remark-text { white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  td.remarks.open .remark-text { -webkit-line-clamp: unset; }
  td.remarks .remark-more { display: none; }
  td.remarks.has-more .remark-more {
    display: inline-block; background: none; border: none; padding: 0; margin-top: 3px;
    cursor: pointer; font-family: inherit; font-size: 11.5px; font-weight: 600; color: var(--primary);
  }
  td.remarks.has-more .remark-more:hover { text-decoration: underline; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--bg); }
  .thumb { width: 38px; height: 38px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); }
  .req-link { color: var(--primary); font-weight: 600; text-decoration: none; }
  .req-link:hover { text-decoration: underline; }
  .btn-sm { padding: 5px 11px; font-size: 12.5px; }
  .row-actions { display: flex; gap: 4px; justify-content: center; }

  .badge { display: inline-block; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; }
  .badge.적합 { background: var(--pass-bg); color: var(--pass); }
  .badge.부적합 { background: var(--fail-bg); color: var(--fail); }
  .badge.조건부적합 { background: var(--cond-bg); color: var(--cond); }

  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .gallery-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); cursor: pointer; transition: box-shadow 0.15s, transform 0.15s; }
  .gallery-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .gallery-card img { width: 100%; height: 150px; object-fit: cover; background: var(--bg); }
  .gallery-card .info { padding: 12px; font-size: 13px; }
  .gallery-card .info .title { font-weight: 700; margin-bottom: 4px; }
  .gallery-card .info .sub { color: var(--text-muted); font-size: 12px; }
  .gallery-card .info .actions { display: flex; gap: 6px; margin-top: 10px; }
  .no-photo { display:flex; align-items:center; justify-content:center; color: var(--text-muted); font-size: 12px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.5); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--card-bg); border-radius: 16px; max-width: 740px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 28px 30px; box-shadow: 0 20px 60px rgba(15,23,42,0.25); }
  .modal h2 { margin: 0 0 20px; font-size: 20px; font-weight: 700; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-item { display: flex; flex-direction: column; gap: 6px; }
  .form-item label { font-size: 13px; font-weight: 600; color: var(--text-muted); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .schedule-item-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .schedule-item-row:last-child { border-bottom: none; }
  .items-head { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 8px; }
  .items-head h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .items-head .hint { font-size: 12.5px; font-weight: 500; color: var(--text-muted); margin-left: 8px; }
  .item-card { border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: #fbfcff; padding: 14px 16px 16px; margin-bottom: 12px; }
  .item-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .item-card-title { font-size: 13.5px; font-weight: 700; color: var(--primary-dark); }
  .item-defect-wrap, .item-defect-photo-wrap, .item-existing-wrap { display: none; }
  .cell-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
  /* 품목이 여러 개인 줄은 내용이 길어지므로 글씨를 줄여 열 안에 들어가게 한다 */
  td.compact { font-size: 12px; }
  td.stacked { padding-top: 10px; padding-bottom: 10px; }
  .stack-row { display: flex; align-items: center; justify-content: center; height: 28px; }
  td.compact .badge { font-size: 11.5px; padding: 4px 9px; }
  td.compact .cell-sub { font-size: 11px; }

  .lightbox-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 200; flex-direction: column; }
  .lightbox-overlay.open { display: flex; }
  .lightbox-overlay img { max-width: 90vw; max-height: 75vh; border-radius: 8px; }
  .lightbox-nav { display: flex; gap: 20px; margin-top: 16px; align-items: center; color: #fff; }
  .lightbox-nav button { background: rgba(255,255,255,0.15); color: #fff; border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  .lightbox-close { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 28px; cursor: pointer; background: none; border: none; }
  .detail-fields { color: #fff; font-size: 13px; margin-top: 10px; text-align: center; max-width: 600px; }

  .file-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .file-preview img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
  .file-preview .photo-item { position: relative; }
  .file-preview .photo-remove {
    position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--fail); color: #fff; border: none; font-size: 12px; line-height: 1; cursor: pointer;
  }
  .status-msg { font-size: 13px; margin-top: 8px; }
  .status-msg.error { color: var(--fail); }
  .status-msg.info { color: var(--text-muted); }

  @media (max-width: 900px) {
    header { flex-wrap: wrap; height: auto; gap: 12px; }
    .topbar-stats { order: 3; flex-basis: 100%; }
  }
  @media (max-width: 700px) {
    .form-grid { grid-template-columns: 1fr; }
  }
</style>

<style>
  /* 공개(읽기 전용) 페이지 — 서버가 없으므로 등록/수정/삭제 관련 요소를 감춘다 */
  button[onclick*="openRegisterModal"],
  button[onclick*="openScheduleRegisterModal"],
  button[onclick*="csvFileInput"],
  .row-actions,
  .gallery-card .info .actions,
  #registerModal,
  #scheduleRegisterModal { display: none !important; }

  /* 목록 맨 오른쪽 '관리' 열은 등록/수정/삭제 전용이므로 열 자체를 숨긴다 */
  #listView table th:last-child,
  #listView table td:last-child { display: none !important; }

  /* 조회 화면을 단순하게 두기 위해 숨기는 버튼들 */
  button[onclick*="resetFilters"],
  button[onclick*="exportCsv"] { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>검사성적서 조회</h1>
  <div class="topbar-stats">
    <div class="stat"><b id="kpiTotal">0</b><span>총 건수</span></div>
    <div class="stat stat-pass"><b id="kpiPass">0</b><span>적합</span></div>
    <div class="stat stat-fail"><b id="kpiFail">0</b><span>부적합 / 조건부</span></div>
    <div class="stat"><b id="kpiRate">0%</b><span>적합률</span></div>
  </div>
  <div class="header-actions">
    <button class="btn btn-secondary" onclick="loadData()">새로고침</button>
    <button class="btn btn-primary" onclick="openRegisterModal()">+ 신규 등록</button>
  </div>
</header>

<main>
  <div class="alert-banner" onclick="openScheduleListModal()">
    <span class="alert-banner-tag">다음검사 일정</span>
    <div class="schedule-list" id="scheduleSummary">로딩중...</div>
    <button type="button" class="btn btn-secondary btn-sm" onclick="event.stopPropagation(); openScheduleRegisterModal()">+ 입고예정 등록</button>
  </div>

  <div class="panel">
    <div class="panel-head">
      <div class="tabs">
        <button id="btnListView" class="active" onclick="switchView('list')">리스트 뷰</button>
        <button id="btnGalleryView" onclick="switchView('gallery')">갤러리 뷰</button>
      </div>
    </div>

    <div class="filter-bar">
      <div class="filter-item">
        <label>검사일자<button type="button" class="link-btn" onclick="clearDateFilter()">초기화</button></label>
        <div class="date-range">
          <input type="date" id="fDate" onchange="applyFilters()" title="이 날짜 하루만 보려면 왼쪽만 고르세요" />
          <span class="date-sep">~</span>
          <input type="date" id="fDateTo" onchange="applyFilters()" title="기간으로 보려면 끝 날짜를 고르세요. 비워두면 왼쪽 날짜 하루만 조회합니다" />
        </div>
      </div>
      <div class="filter-item">
        <label>업체명</label>
        <input type="text" id="fVendor" placeholder="검색" oninput="applyFilters()" />
      </div>
      <div class="filter-item">
        <label>품목명</label>
        <input type="text" id="fItem" placeholder="검색" oninput="applyFilters()" />
      </div>
      <div class="filter-item">
        <label>검사결과</label>
        <select id="fResult" onchange="applyFilters()">
          <option value="">전체</option>
          <option value="적합">적합</option>
          <option value="부적합">부적합</option>
          <option value="조건부적합">조건부적합</option>
        </select>
      </div>
      <button class="btn btn-secondary" onclick="resetFilters()">필터 초기화</button>
      <button class="btn btn-secondary" onclick="exportCsv()">CSV 내보내기</button>
      <button class="btn btn-secondary" onclick="document.getElementById('csvFileInput').click()">CSV 불러오기</button>
      <input type="file" id="csvFileInput" accept=".csv,text/csv" onchange="importCsv(event)" hidden />
    </div>

    <div id="listView">
      <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>문서번호</th>
            <th class="center">검사일자</th>
            <th>업체명</th>
            <th>품목명</th>
            <th>색상</th>
            <th class="num">수량</th>
            <th class="center">검사자</th>
            <th class="center">검사결과</th>
            <th class="center">사진</th>
            <th class="center">검사의뢰서</th>
            <th>비고</th>
            <th class="center">성적서</th>
            <th class="center">성적서(ERP)</th>
            <th class="center">관리</th>
          </tr>
        </thead>
        <tbody id="listBody"></tbody>
      </table>
      </div>
      <div class="empty-state" id="listEmpty" style="display:none;">등록된 검사성적서가 없습니다.</div>
    </div>

    <div id="galleryView" class="gallery" style="display:none;"></div>
  </div>
</main>

<!-- 신규 등록 모달 -->
<div class="modal-overlay" id="registerModal">
  <div class="modal">
    <h2 id="registerModalTitle">검사성적서 신규 등록</h2>
    <form id="registerForm">
      <div class="form-grid">
        <div class="form-item">
          <label>검사일자</label>
          <input type="date" id="iDate" required />
        </div>
        <div class="form-item">
          <label>업체명</label>
          <input type="text" id="iVendor" required />
        </div>
        <div class="form-item">
          <label>검사자</label>
          <input type="text" id="iInspector" />
        </div>
        <div class="form-item">
          <label>검사항목</label>
          <input type="text" id="iInspectionItem" />
        </div>
        <div class="form-item full">
          <label>기준</label>
          <textarea id="iCriteria" rows="4"></textarea>
        </div>
      </div>

      <div class="items-head">
        <h3>검사 품목<span class="hint">품목마다 판정과 사진을 따로 등록합니다</span></h3>
        <button type="button" class="btn btn-secondary btn-sm" onclick="addItemCard()">+ 품목 추가</button>
      </div>
      <div id="itemsWrap"></div>

      <div class="form-grid">
        <div class="form-item full">
          <label>검사의뢰서 링크 (선택)</label>
          <input type="url" id="iRequestDocUrl" placeholder="https://..." />
        </div>
        <div class="form-item full">
          <label>성적서(ERP) 링크 (선택)</label>
          <input type="url" id="iReportDocUrl" placeholder="https://..." />
        </div>
        <div class="form-item full">
          <label>비고 (성적서 전체)</label>
          <textarea id="iRemarks" rows="2" placeholder="품목별 비고는 각 품목 카드 안에 적습니다"></textarea>
        </div>
      </div>
      <div class="status-msg info" id="registerStatus"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeRegisterModal()">취소</button>
        <button type="submit" class="btn btn-primary" id="submitBtn">등록</button>
      </div>
    </form>
  </div>
</div>

<!-- 입고예정 등록 모달 -->
<div class="modal-overlay" id="scheduleRegisterModal">
  <div class="modal">
    <h2 id="scheduleModalTitle">입고예정 등록</h2>
    <form id="scheduleForm">
      <div class="form-grid">
        <div class="form-item">
          <label>입고예정일</label>
          <input type="date" id="sDate" required />
        </div>
        <div class="form-item">
          <label>업체명</label>
          <input type="text" id="sVendor" required />
        </div>
        <div class="form-item">
          <label>품목명</label>
          <input type="text" id="sItem" required />
        </div>
        <div class="form-item">
          <label>색상</label>
          <input type="text" id="sColor" />
        </div>
        <div class="form-item full">
          <label>검사의뢰서 링크 (선택)</label>
          <input type="url" id="sRequestDocUrl" placeholder="https://..." />
        </div>
      </div>
      <div class="status-msg info" id="scheduleStatus"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeScheduleRegisterModal()">취소</button>
        <button type="submit" class="btn btn-primary" id="scheduleSubmitBtn">등록</button>
      </div>
    </form>
  </div>
</div>

<!-- 입고예정 목록 모달 -->
<div class="modal-overlay" id="scheduleListModal">
  <div class="modal">
    <h2>입고예정 목록</h2>
    <div id="scheduleListBody"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" onclick="closeScheduleListModal()">닫기</button>
    </div>
  </div>
</div>

<!-- 사진 확대 / 상세보기 -->
<div class="lightbox-overlay" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <img id="lightboxImg" src="" />
  <div class="lightbox-nav">
    <button onclick="lightboxPrev()">‹ 이전</button>
    <span id="lightboxCount"></span>
    <button onclick="lightboxNext()">다음 ›</button>
    <button onclick="downloadCurrentPhoto(this)">사진 다운로드</button>
    <button onclick="downloadAllPhotos(this)">전체 다운로드</button>
  </div>
  <div class="detail-fields" id="lightboxDetail"></div>
</div>

<script>
  let allRecords = [];
  let filteredRecords = [];
  let currentView = 'list';
  let lightboxPhotos = [];
  let lightboxIndex = 0;
  let lightboxRecord = null;
  let editingId = null;
  // 품목 카드 하나당 상태(유지할 기존 사진 목록 + 새로 고른 파일)를 순서대로 담아 둔다.
  let itemStates = [];
  let itemUidSeq = 0;

  function escHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function escAttr(value) {
    return escHtml(value).replace(/"/g, '&quot;');
  }
  // 예전 형식(품목 1개)도 items 배열처럼 다룰 수 있게 맞춰 준다.
  function recordItems(r) {
    if (r.items && r.items.length) return r.items;
    return [{
      itemName: r.itemName || '', color: r.color || '', lotNo: r.lotNo || '',
      quantity: r.quantity != null ? r.quantity : null,
      result: r.result || '적합', defectDetail: r.defectDetail || '',
      photoUrls: r.photoUrls || [], defectPhotoUrls: r.defectPhotoUrls || []
    }];
  }
  // 목록에는 첫 품목만 보여 주고 나머지는 "외 N건"으로 줄인다.
  function summarizeField(items, field) {
    const first = items.length ? (items[0][field] || '') : '';
    return items.length > 1 ? `${first} 외 ${items.length - 1}건` : first;
  }
  // 품목이 여러 개면 한 칸 안에 줄바꿈해서 전부 보여 준다.
  function stackField(items, field) {
    return items.map(it => `<div class="stack-row">${escHtml(it[field] || '-')}</div>`).join('');
  }
  // 검사결과도 품목마다 한 줄씩 보여 준다.
  function stackResults(items) {
    return items.map(it =>
      `<div class="stack-row"><span class="badge ${it.result}">${escHtml(it.result)}</span></div>`
    ).join('');
  }
  function itemsTooltip(items) {
    return items.map((it, i) => {
      const parts = [it.itemName, it.color, it.lotNo].filter(Boolean).join(' / ');
      const qty = it.quantity != null ? ` · ${it.quantity}개` : '';
      return `${i + 1}. ${parts}${qty} · ${it.result || ''}`;
    }).join('\n');
  }
  function totalQuantity(items) {
    const numbers = items.map(it => it.quantity).filter(q => typeof q === 'number' && Number.isFinite(q));
    return numbers.length ? numbers.reduce((sum, n) => sum + n, 0) : null;
  }
  // 수량 표기. 품목이 여러 개면서 모두 1개씩이면 '각 1EA', 수량이 서로 다르면 합계를 보여 준다.
  function formatQuantity(items) {
    const numbers = items.map(it => it.quantity).filter(q => typeof q === 'number' && Number.isFinite(q));
    if (!numbers.length) return '';
    if (items.length === 1) return numbers[0] + 'EA';
    if (numbers.length === items.length && numbers.every(n => n === 1)) return '각 1EA';
    return '총 ' + numbers.reduce((sum, n) => sum + n, 0) + 'EA';
  }

  const DEFAULT_INSPECTION_ITEM = '외관 및 치수';
  const DEFAULT_CRITERIA = '1. 일반공차 ± 0.5 이내\n2. 퍼시스,일룸 이물질 0.4mm² 이내\n3. 평 엣지 및 45° 엣지 트리밍 상태\n4. 조립철물';

  async function loadData() {
    try {
      const res = await fetch('data.json?t=' + Date.now());
      if (!res.ok) throw new Error('서버 응답 오류 (' + res.status + ')');
      const payload = await res.json();
      allRecords = Array.isArray(payload) ? payload : (payload.records || []);
      if (payload && payload.exportedAt) {
        const stamp = document.getElementById('exportStamp');
        if (stamp) stamp.textContent = '데이터 기준: ' + payload.exportedAt.slice(0, 16).replace('T', ' ');
      }
      applyFilters();
    } catch (err) {
      document.getElementById('listEmpty').style.display = 'block';
      document.getElementById('listEmpty').textContent = '데이터를 불러오지 못했습니다: ' + err.message;
    }
  }
  loadData();

  let scheduledItems = [];
  let editingScheduleId = null;

  async function loadScheduled() {
    try {
      const res = await fetch('scheduled.json?t=' + Date.now());
      if (!res.ok) throw new Error('서버 응답 오류 (' + res.status + ')');
      scheduledItems = await res.json();
      renderScheduleSummary();
    } catch (err) {
      document.getElementById('scheduleSummary').innerHTML = `<div class="schedule-empty">불러오기 실패</div>`;
    }
  }
  loadScheduled();

  function formatShortDate(d) {
    if (!d) return '날짜미정';
    const parts = d.split('-');
    return `${Number(parts[1])}/${Number(parts[2])}`;
  }

  function renderScheduleSummary() {
    const el = document.getElementById('scheduleSummary');
    if (!scheduledItems.length) {
      el.innerHTML = '<div class="schedule-empty">예정된 입고가 없습니다.</div>';
      return;
    }
    const shown = scheduledItems.slice(0, 4);
    el.innerHTML = shown.map(s => {
      const itemColor = [s.itemName || '', s.color || ''].filter(Boolean).join('/');
      return `<div class="schedule-row"><b>${formatShortDate(s.scheduledDate)}</b>${s.vendor || ''} · ${itemColor} 입고예정</div>`;
    }).join('') + (scheduledItems.length > shown.length ? `<div class="schedule-more">외 ${scheduledItems.length - shown.length}건</div>` : '');
  }

  function openScheduleRegisterModal() {
    editingScheduleId = null;
    scheduleModalReturnToList = false;
    document.getElementById('scheduleForm').reset();
    document.getElementById('scheduleModalTitle').textContent = '입고예정 등록';
    document.getElementById('scheduleSubmitBtn').textContent = '등록';
    document.getElementById('scheduleStatus').textContent = '';
    document.getElementById('scheduleRegisterModal').classList.add('open');
  }
  let scheduleModalReturnToList = false;
  function openScheduleEditModal(id) {
    const s = scheduledItems.find(x => x.id === id);
    if (!s) return;
    editingScheduleId = id;
    scheduleModalReturnToList = true;
    document.getElementById('scheduleListModal').classList.remove('open');
    document.getElementById('sDate').value = s.scheduledDate || '';
    document.getElementById('sVendor').value = s.vendor || '';
    document.getElementById('sItem').value = s.itemName || '';
    document.getElementById('sColor').value = s.color || '';
    document.getElementById('sRequestDocUrl').value = s.requestDocUrl || '';
    document.getElementById('scheduleModalTitle').textContent = '입고예정 수정';
    document.getElementById('scheduleSubmitBtn').textContent = '수정 저장';
    document.getElementById('scheduleStatus').textContent = '';
    document.getElementById('scheduleRegisterModal').classList.add('open');
  }
  function closeScheduleRegisterModal() {
    document.getElementById('scheduleRegisterModal').classList.remove('open');
    if (scheduleModalReturnToList) {
      scheduleModalReturnToList = false;
      renderScheduleListModal();
      document.getElementById('scheduleListModal').classList.add('open');
    }
  }

  document.getElementById('scheduleForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('scheduleStatus');
    status.className = 'status-msg info';
    status.textContent = editingScheduleId ? '수정 중입니다...' : '등록 중입니다...';
    try {
      const url = editingScheduleId ? `/api/scheduled/${editingScheduleId}` : '/api/scheduled';
      const res = await fetch(url, {
        method: editingScheduleId ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          scheduledDate: document.getElementById('sDate').value,
          vendor: document.getElementById('sVendor').value.trim(),
          itemName: document.getElementById('sItem').value.trim(),
          color: document.getElementById('sColor').value.trim(),
          requestDocUrl: document.getElementById('sRequestDocUrl').value.trim()
        })
      });
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.error || '서버 응답 오류 (' + res.status + ')');
      }
      await loadScheduled();
      closeScheduleRegisterModal();
    } catch (err) {
      status.className = 'status-msg error';
      status.textContent = (editingScheduleId ? '수정 실패: ' : '등록 실패: ') + err.message;
    }
  });

  function openScheduleListModal() {
    renderScheduleListModal();
    document.getElementById('scheduleListModal').classList.add('open');
  }
  function closeScheduleListModal() {
    document.getElementById('scheduleListModal').classList.remove('open');
  }
  function renderScheduleListModal() {
    const body = document.getElementById('scheduleListBody');
    if (!scheduledItems.length) {
      body.innerHTML = '<div class="empty-state">등록된 입고예정이 없습니다.</div>';
      return;
    }
    body.innerHTML = scheduledItems.map(s => {
      const itemColor = [s.itemName || '', s.color || ''].filter(Boolean).join('/');
      return `
      <div class="schedule-item-row">
        <div>
          <b>${s.scheduledDate || '날짜미정'}</b> · ${s.vendor || ''} · ${itemColor}
          ${s.requestDocUrl ? `<a class="req-link" href="${s.requestDocUrl}" target="_blank" rel="noopener">의뢰서 보기</a>` : ''}
        </div>
        <div class="row-actions">
          <button type="button" class="btn btn-secondary btn-sm" onclick="openScheduleEditModal('${s.id}')">수정</button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="deleteScheduledItem('${s.id}')">삭제</button>
        </div>
      </div>
    `;
    }).join('');
  }
  async function deleteScheduledItem(id) {
    if (!confirm('이 입고예정 항목을 삭제하시겠습니까?')) return;
    try {
      const res = await fetch(`/api/scheduled/${id}`, { method: 'DELETE' });
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.error || '서버 응답 오류 (' + res.status + ')');
      }
      await loadScheduled();
      renderScheduleListModal();
    } catch (err) {
      alert('삭제 실패: ' + err.message);
    }
  }

  function applyFilters() {
    const dateFrom = document.getElementById('fDate').value;
    const dateTo = document.getElementById('fDateTo').value;
    const vendor = document.getElementById('fVendor').value.trim().toLowerCase();
    const item = document.getElementById('fItem').value.trim().toLowerCase();
    const result = document.getElementById('fResult').value;

    filteredRecords = allRecords.filter(r => {
      if (dateFrom || dateTo) {
        // 한쪽만 골랐으면 그 날짜 하루만, 둘 다 골랐으면 그 기간을 본다. 순서가 뒤바뀌어도 알아서 맞춘다.
        const a = dateFrom || dateTo;
        const b = dateTo || dateFrom;
        const from = a <= b ? a : b;
        const to = a <= b ? b : a;
        if (r.inspectionDate < from || r.inspectionDate > to) return false;
      }
      if (vendor && !(r.vendor || '').toLowerCase().includes(vendor)) return false;
      if (item && !recordItems(r).some(it => (it.itemName || '').toLowerCase().includes(item))) return false;
      if (result && !recordItems(r).some(it => it.result === result)) return false;
      return true;
    });

    renderKpi();
    renderList();
    renderGallery();
  }

  function clearDateFilter() {
    document.getElementById('fDate').value = '';
    document.getElementById('fDateTo').value = '';
    applyFilters();
  }

  function resetFilters() {
    document.getElementById('fDate').value = '';
    document.getElementById('fDateTo').value = '';
    document.getElementById('fVendor').value = '';
    document.getElementById('fItem').value = '';
    document.getElementById('fResult').value = '';
    applyFilters();
  }

  // kind: 'common' = 성적서 공통값(품목 줄마다 반복), 'item' = 품목별 값
  const csvColumns = [
    ['inspectionNo', '문서번호', 'common'],
    ['inspectionDate', '검사일자', 'common'],
    ['vendor', '업체명', 'common'],
    ['itemName', '품목명', 'item'],
    ['color', '색상', 'item'],
    ['lotNo', 'Lot No.', 'item'],
    ['quantity', '수량', 'item'],
    ['inspector', '검사자', 'common'],
    ['inspectionItem', '검사항목', 'common'],
    ['criteria', '기준', 'common'],
    ['result', '검사결과', 'item'],
    ['defectDetail', '불량내용', 'item'],
    ['remarks', '품목비고', 'item'],
    ['requestDocUrl', '검사의뢰서', 'common'],
    ['reportDocUrl', '성적서(ERP)', 'common'],
    ['remarks', '비고', 'common']
  ];

  function escapeCsvValue(value) {
    const text = value == null ? '' : String(value);
    return /[",\r\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
  }

  function exportCsv() {
    // 품목이 여러 개인 성적서는 품목마다 한 줄씩 나가고, 공통값은 각 줄에 반복된다.
    const rows = [csvColumns.map(([, label]) => label)];
    filteredRecords.forEach(record => {
      recordItems(record).forEach(item => {
        rows.push(csvColumns.map(([field, , kind]) =>
          escapeCsvValue(kind === 'item' ? item[field] : record[field])));
      });
    });
    const csv = '\uFEFF' + rows.map(row => row.join(',')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = '검사성적서_' + new Date().toISOString().slice(0, 10) + '.csv';
    link.click();
    URL.revokeObjectURL(url);
  }

  function parseCsv(text) {
    const rows = [];
    let row = [];
    let value = '';
    let quoted = false;
    for (let index = 0; index < text.length; index += 1) {
      const character = text[index];
      if (character === '"') {
        if (quoted && text[index + 1] === '"') {
          value += '"';
          index += 1;
        } else {
          quoted = !quoted;
        }
      } else if (character === ',' && !quoted) {
        row.push(value);
        value = '';
      } else if ((character === '\n' || character === '\r') && !quoted) {
        if (character === '\r' && text[index + 1] === '\n') index += 1;
        row.push(value);
        if (row.some(cell => cell !== '')) rows.push(row);
        row = [];
        value = '';
      } else {
        value += character;
      }
    }
    if (value || row.length) {
      row.push(value);
      if (row.some(cell => cell !== '')) rows.push(row);
    }
    return rows;
  }

  async function importCsv(event) {
    const input = event.target;
    const file = input.files[0];
    if (!file) return;
    try {
      const text = (await file.text()).replace(/^\uFEFF/, '');
      const rows = parseCsv(text);
      if (rows.length < 2) throw new Error('헤더와 데이터가 있는 CSV 파일을 선택해 주세요.');
      const header = rows[0].map(cell => cell.trim());
      const requiredLabels = ['검사일자', '업체명', '품목명'];
      if (requiredLabels.some(label => header.indexOf(label) === -1)) {
        throw new Error('검사성적서 CSV 형식의 헤더가 아닙니다.');
      }
      // 성적서 비고('비고')와 품목 비고('품목비고')는 필드명이 같으므로 헤더 이름으로 위치를 잡는다.
      const columnIndex = {};
      csvColumns.forEach(([, label]) => { columnIndex[label] = header.indexOf(label); });

      // 문서번호가 같은 연속된 줄은 품목이 여러 개인 성적서 한 장으로 묶는다.
      const groups = [];
      rows.slice(1).forEach(row => {
        const cell = label => {
          const index = columnIndex[label];
          return index == null || index === -1 ? '' : (row[index] || '').trim();
        };
        const item = {};
        csvColumns.filter(([, , kind]) => kind === 'item').forEach(([field, label]) => { item[field] = cell(label); });
        const docNo = cell('문서번호');
        const last = groups[groups.length - 1];
        if (docNo && last && last.docNo === docNo) {
          last.items.push(item);
          return;
        }
        const common = {};
        csvColumns.filter(([, , kind]) => kind === 'common').forEach(([field, label]) => { common[field] = cell(label); });
        groups.push({ docNo, common, items: [item] });
      });

      let importedCount = 0;
      for (const group of groups) {
        const items = group.items.filter(it => it.itemName);
        if (!group.common.inspectionDate || !group.common.vendor || !items.length) {
          throw new Error('검사일자, 업체명, 품목명은 비워둘 수 없습니다.');
        }
        const formData = new FormData();
        Object.entries(group.common).forEach(([field, value]) => {
          if (field !== 'inspectionNo') formData.append(field, value);
        });
        formData.append('items', JSON.stringify(items));
        const res = await fetch('/api/inspections', { method: 'POST', body: formData });
        if (!res.ok) {
          const errBody = await res.json().catch(() => ({}));
          throw new Error(errBody.error || '서버 응답 오류 (' + res.status + ')');
        }
        importedCount += 1;
      }
      await loadData();
      alert(importedCount + '건을 불러왔습니다.');
    } catch (err) {
      alert('CSV 불러오기에 실패했습니다: ' + err.message);
    } finally {
      input.value = '';
    }
  }

  function renderKpi() {
    const total = filteredRecords.length;
    const pass = filteredRecords.filter(r => r.result === '적합').length;
    const fail = total - pass;
    const rate = total ? Math.round((pass / total) * 100) : 0;
    document.getElementById('kpiTotal').textContent = total;
    document.getElementById('kpiPass').textContent = pass;
    document.getElementById('kpiFail').textContent = fail;
    document.getElementById('kpiRate').textContent = rate + '%';
  }

  function renderList() {
    const body = document.getElementById('listBody');
    const empty = document.getElementById('listEmpty');
    body.innerHTML = '';
    if (!filteredRecords.length) {
      empty.style.display = 'block';
      empty.textContent = '등록된 검사성적서가 없습니다.';
      return;
    }
    empty.style.display = 'none';
    filteredRecords.forEach(r => {
      const tr = document.createElement('tr');
      const items = recordItems(r);
      const photos = r.photoUrls || [];
      const thumb = photos.length
        ? `<img class="thumb" src="${photos[0]}" onclick="openLightbox('${r.id}')" />`
        : '-';
      const reqLink = r.requestDocUrl
        ? `<a class="req-link" href="${r.requestDocUrl}" target="_blank" rel="noopener">보기</a>`
        : '-';
      const reportLink = r.reportDocUrl
        ? `<a class="req-link" href="${r.reportDocUrl}" target="_blank" rel="noopener">보기</a>`
        : '-';
      const tooltip = escAttr(itemsTooltip(items));
      const quantityText = formatQuantity(items);
      const compact = items.length > 1 ? ' compact' : '';
      tr.innerHTML = `
        <td title="${escAttr(r.inspectionNo)}">${escHtml(r.inspectionNo)}</td>
        <td class="center">${escHtml(r.inspectionDate)}</td>
        <td title="${escAttr(r.vendor)}">${escHtml(r.vendor)}</td>
        <td class="stacked${compact}" title="${tooltip}">${stackField(items, 'itemName')}</td>
        <td class="stacked${compact}" title="${tooltip}">${stackField(items, 'color')}</td>
        <td class="num${compact}" title="${tooltip}">${quantityText}</td>
        <td class="center">${escHtml(r.inspector)}</td>
        <td class="stacked${compact}">${stackResults(items)}</td>
        <td class="center">${thumb}</td>
        <td class="center">${reqLink}</td>
        <td class="remarks">
          <div class="remark-text">${escHtml(r.remarks)}</div>
          <button type="button" class="remark-more" onclick="toggleRemark(this)">더보기</button>
        </td>
        <td class="center"><a class="req-link" href="report.html?id=${r.id}" target="_blank" rel="noopener">보기</a></td>
        <td class="center">${reportLink}</td>
        <td class="center">
          <div class="row-actions">
            <button type="button" class="btn btn-secondary btn-sm" onclick="duplicateRecord('${r.id}')">복제</button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="openEditModal('${r.id}')">수정</button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="deleteRecord('${r.id}')">삭제</button>
          </div>
        </td>
      `;
      body.appendChild(tr);
    });
    markOverflowingRemarks();
  }

  // 실제로 글이 잘린 칸에만 '더보기'를 띄운다.
  function markOverflowingRemarks() {
    document.querySelectorAll('#listBody td.remarks').forEach(cell => {
      const text = cell.querySelector('.remark-text');
      if (!text) return;
      cell.classList.toggle('has-more', text.scrollHeight > text.clientHeight + 2);
    });
  }

  function toggleRemark(button) {
    const cell = button.closest('td');
    cell.classList.toggle('open');
    button.textContent = cell.classList.contains('open') ? '접기' : '더보기';
  }

  function renderGallery() {
    const grid = document.getElementById('galleryView');
    grid.innerHTML = '';
    if (!filteredRecords.length) {
      grid.innerHTML = '<div class="empty-state">등록된 검사성적서가 없습니다.</div>';
      return;
    }
    filteredRecords.forEach(r => {
      const photos = r.photoUrls || [];
      const card = document.createElement('div');
      card.className = 'gallery-card';
      const photoHtml = photos.length
        ? `<img src="${photos[0]}" />`
        : `<div class="no-photo" style="height:150px;">사진 없음</div>`;
      card.innerHTML = `
        ${photoHtml}
        <div class="info">
          <div class="title">${escHtml(summarizeField(recordItems(r), 'itemName'))} <span class="badge ${r.result}">${r.result || ''}</span></div>
          <div class="sub">${r.vendor || ''} · ${r.inspectionDate || ''}</div>
          <div class="actions">
            <button type="button" class="btn btn-secondary btn-sm" data-action="duplicate">복제</button>
            <button type="button" class="btn btn-secondary btn-sm" data-action="edit">수정</button>
            <button type="button" class="btn btn-secondary btn-sm" data-action="delete">삭제</button>
          </div>
        </div>
      `;
      card.addEventListener('click', (e) => {
        const action = e.target.closest('[data-action]');
        if (action?.dataset.action === 'duplicate') { e.stopPropagation(); duplicateRecord(r.id); return; }
        if (action?.dataset.action === 'edit') { e.stopPropagation(); openEditModal(r.id); return; }
        if (action?.dataset.action === 'delete') { e.stopPropagation(); deleteRecord(r.id); return; }
        openLightbox(r.id);
      });
      grid.appendChild(card);
    });
  }

  function recordSummary(r) {
    const items = recordItems(r);
    return `${r.inspectionNo || ''} · ${r.inspectionDate || ''} · ${r.vendor || ''} · ${summarizeField(items, 'itemName')} · ${r.result || ''}` +
      (r.defectDetail ? ` · 불량내용: ${r.defectDetail}` : '');
  }

  function switchView(view) {
    currentView = view;
    document.getElementById('listView').style.display = view === 'list' ? 'block' : 'none';
    document.getElementById('galleryView').style.display = view === 'gallery' ? 'grid' : 'none';
    document.getElementById('btnListView').classList.toggle('active', view === 'list');
    document.getElementById('btnGalleryView').classList.toggle('active', view === 'gallery');
  }

  // ---- 라이트박스 ----
  function openLightbox(id) {
    const r = allRecords.find(x => x.id === id);
    const photos = r?.photoUrls || [];
    if (!photos.length) return;
    lightboxRecord = r;
    lightboxPhotos = photos;
    lightboxIndex = 0;
    document.getElementById('lightboxDetail').textContent = recordSummary(r);
    updateLightboxImg();
    document.getElementById('lightbox').classList.add('open');
  }
  function updateLightboxImg() {
    document.getElementById('lightboxImg').src = lightboxPhotos[lightboxIndex];
    document.getElementById('lightboxCount').textContent = `${lightboxIndex + 1} / ${lightboxPhotos.length}`;
  }
  function lightboxPrev() {
    lightboxIndex = (lightboxIndex - 1 + lightboxPhotos.length) % lightboxPhotos.length;
    updateLightboxImg();
  }
  function lightboxNext() {
    lightboxIndex = (lightboxIndex + 1) % lightboxPhotos.length;
    updateLightboxImg();
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
  }

  function triggerBlobDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }
  function photoExt(url) {
    const clean = url.split('?')[0];
    const ext = clean.slice(clean.lastIndexOf('.') + 1);
    return ext && ext.length <= 5 ? ext : 'jpg';
  }
  function photoBaseName(r) {
    return [r?.itemName || '', r?.color || ''].filter(Boolean).join('+') || '사진';
  }
  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }
  async function downloadCurrentPhoto(btn) {
    const url = lightboxPhotos[lightboxIndex];
    if (!url) return;
    btn.disabled = true;
    try {
      const res = await fetch(url);
      const blob = await res.blob();
      const base = photoBaseName(lightboxRecord);
      const suffix = lightboxPhotos.length > 1 ? `_${lightboxIndex + 1}` : '';
      triggerBlobDownload(blob, `${base}${suffix}.${photoExt(url)}`);
    } catch (err) {
      alert('다운로드 실패: ' + err.message);
    } finally {
      btn.disabled = false;
    }
  }
  async function downloadAllPhotos(btn) {
    if (!lightboxPhotos.length) return;
    btn.disabled = true;
    const prevText = btn.textContent;
    btn.textContent = '다운로드 중...';
    try {
      const base = photoBaseName(lightboxRecord);
      for (let i = 0; i < lightboxPhotos.length; i++) {
        const url = lightboxPhotos[i];
        const res = await fetch(url);
        const blob = await res.blob();
        triggerBlobDownload(blob, `${base}_${i + 1}.${photoExt(url)}`);
        if (i < lightboxPhotos.length - 1) await sleep(300);
      }
    } catch (err) {
      alert('전체 다운로드 실패: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = prevText;
    }
  }

  // ---- 등록/수정 모달 ----
  function openRegisterModal() {
    editingId = null;
    document.getElementById('registerForm').reset();
    resetItemCards();
    addItemCard();
    document.getElementById('iDate').value = new Date().toISOString().slice(0, 10);
    document.getElementById('iInspectionItem').value = DEFAULT_INSPECTION_ITEM;
    document.getElementById('iCriteria').value = DEFAULT_CRITERIA;
    document.getElementById('registerStatus').textContent = '';
    document.getElementById('registerModalTitle').textContent = '검사성적서 신규 등록';
    document.getElementById('submitBtn').textContent = '등록';
    document.getElementById('registerModal').classList.add('open');
  }

  function openEditModal(id) {
    const r = allRecords.find(x => x.id === id);
    if (!r) return;
    editingId = id;
    document.getElementById('registerForm').reset();
    resetItemCards();
    recordItems(r).forEach(item => addItemCard(item));
    if (!itemStates.length) addItemCard();
    document.getElementById('iDate').value = r.inspectionDate || '';
    document.getElementById('iVendor').value = r.vendor || '';
    document.getElementById('iInspector').value = r.inspector || '';
    document.getElementById('iInspectionItem').value = r.inspectionItem || DEFAULT_INSPECTION_ITEM;
    document.getElementById('iCriteria').value = r.criteria || DEFAULT_CRITERIA;
    document.getElementById('iRequestDocUrl').value = r.requestDocUrl || '';
    document.getElementById('iReportDocUrl').value = r.reportDocUrl || '';
    document.getElementById('iRemarks').value = r.remarks || '';
    document.getElementById('registerStatus').textContent = '';
    document.getElementById('registerModalTitle').textContent = '검사성적서 수정';
    document.getElementById('submitBtn').textContent = '수정 저장';
    document.getElementById('registerModal').classList.add('open');
  }

  function duplicateRecord(id) {
    const r = allRecords.find(x => x.id === id);
    if (!r) return;
    openRegisterModal();
    document.getElementById('iDate').value = r.inspectionDate || new Date().toISOString().slice(0, 10);
    document.getElementById('iVendor').value = r.vendor || '';
    document.getElementById('iInspector').value = r.inspector || '';
    document.getElementById('iInspectionItem').value = r.inspectionItem || DEFAULT_INSPECTION_ITEM;
    document.getElementById('iCriteria').value = r.criteria || DEFAULT_CRITERIA;
    document.getElementById('iRequestDocUrl').value = r.requestDocUrl || '';
  }

  async function deleteRecord(id) {
    if (!confirm('이 검사성적서를 삭제하시겠습니까? 삭제 후에는 되돌릴 수 없습니다.')) return;
    try {
      const res = await fetch(`/api/inspections/${id}`, { method: 'DELETE' });
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.error || '서버 응답 오류 (' + res.status + ')');
      }
      await loadData();
    } catch (err) {
      alert('삭제 실패: ' + err.message);
    }
  }

  function closeRegisterModal() {
    document.getElementById('registerModal').classList.remove('open');
  }
  // ---- 품목 카드 ----
  function itemCardHtml(uid, data) {
    return `
      <div class="item-card" data-uid="${uid}">
        <div class="item-card-head">
          <span class="item-card-title">품목</span>
          <button type="button" class="btn btn-secondary btn-sm item-remove" onclick="removeItemCard('${uid}')">품목 삭제</button>
        </div>
        <div class="form-grid">
          <div class="form-item">
            <label>품목명</label>
            <input type="text" class="it-name" required value="${escAttr(data.itemName)}" />
          </div>
          <div class="form-item">
            <label>색상</label>
            <input type="text" class="it-color" value="${escAttr(data.color)}" />
          </div>
          <div class="form-item">
            <label>Lot No.</label>
            <input type="text" class="it-lot" value="${escAttr(data.lotNo)}" />
          </div>
          <div class="form-item">
            <label>수량</label>
            <input type="number" class="it-qty" min="0" value="${data.quantity != null ? data.quantity : ''}" />
          </div>
          <div class="form-item">
            <label>검사결과</label>
            <select class="it-result" onchange="toggleItemDefect('${uid}')">
              <option value="적합">적합</option>
              <option value="부적합">부적합</option>
              <option value="조건부적합">조건부적합</option>
            </select>
          </div>
          <div class="form-item full item-defect-wrap">
            <label>불량내용</label>
            <textarea class="it-defect" rows="2">${escHtml(data.defectDetail)}</textarea>
          </div>
          <div class="form-item full">
            <label>비고</label>
            <textarea class="it-remarks" rows="2">${escHtml(data.remarks)}</textarea>
          </div>
          <div class="form-item full item-existing-wrap">
            <label>기존 사진 (x를 누르면 제거됩니다)</label>
            <div class="file-preview it-existing"></div>
          </div>
          <div class="form-item full">
            <label>사진 추가 (여러 장 선택 가능)</label>
            <input type="file" class="it-photos" accept="image/*" multiple />
            <div class="file-preview it-photo-preview"></div>
          </div>
          <div class="form-item full item-defect-photo-wrap">
            <label>불량사진 (여러 장 선택 가능)</label>
            <div class="file-preview it-existing-defect"></div>
            <input type="file" class="it-defect-photos" accept="image/*" multiple />
            <div class="file-preview it-defect-preview"></div>
          </div>
        </div>
      </div>`;
  }

  function resetItemCards() {
    itemStates = [];
    document.getElementById('itemsWrap').innerHTML = '';
  }

  function addItemCard(data) {
    const values = data || {};
    const uid = 'item' + (++itemUidSeq);
    const state = {
      uid,
      keepPhotos: [...(values.photoUrls || [])],
      keepDefectPhotos: [...(values.defectPhotoUrls || [])],
      files: [],
      defectFiles: []
    };
    itemStates.push(state);

    const wrap = document.getElementById('itemsWrap');
    wrap.insertAdjacentHTML('beforeend', itemCardHtml(uid, values));
    const card = wrap.lastElementChild;
    card.querySelector('.it-result').value = values.result || '적합';
    card.querySelector('.it-photos').addEventListener('change', event => {
      state.files = Array.from(event.target.files);
      renderItemPhotos(card, state);
    });
    card.querySelector('.it-defect-photos').addEventListener('change', event => {
      state.defectFiles = Array.from(event.target.files);
      renderItemPhotos(card, state);
    });
    renderItemPhotos(card, state);
    toggleItemDefect(uid);
    renumberItemCards();
    return card;
  }

  function removeItemCard(uid) {
    if (itemStates.length <= 1) {
      alert('품목은 최소 1개는 있어야 합니다.');
      return;
    }
    const card = document.querySelector(`#itemsWrap .item-card[data-uid="${uid}"]`);
    if (card) card.remove();
    itemStates = itemStates.filter(state => state.uid !== uid);
    renumberItemCards();
  }

  function renumberItemCards() {
    const cards = Array.from(document.querySelectorAll('#itemsWrap .item-card'));
    cards.forEach((card, index) => {
      card.querySelector('.item-card-title').textContent = '품목 ' + (index + 1);
      card.querySelector('.item-remove').style.visibility = cards.length > 1 ? 'visible' : 'hidden';
    });
  }

  function toggleItemDefect(uid) {
    const card = document.querySelector(`#itemsWrap .item-card[data-uid="${uid}"]`);
    if (!card) return;
    const show = card.querySelector('.it-result').value !== '적합';
    card.querySelector('.item-defect-wrap').style.display = show ? 'flex' : 'none';
    card.querySelector('.item-defect-photo-wrap').style.display = show ? 'flex' : 'none';
  }

  function renderThumbList(container, urls, onRemove) {
    container.innerHTML = '';
    urls.forEach(url => {
      const item = document.createElement('div');
      item.className = 'photo-item';
      item.innerHTML = `<img src="${url}" /><button type="button" class="photo-remove" title="제거">&times;</button>`;
      item.querySelector('.photo-remove').onclick = () => onRemove(url);
      container.appendChild(item);
    });
  }

  function renderItemPhotos(card, state) {
    const existingWrap = card.querySelector('.item-existing-wrap');
    existingWrap.style.display = state.keepPhotos.length ? 'flex' : 'none';
    renderThumbList(card.querySelector('.it-existing'), state.keepPhotos, url => {
      state.keepPhotos = state.keepPhotos.filter(u => u !== url);
      renderItemPhotos(card, state);
    });
    renderThumbList(card.querySelector('.it-existing-defect'), state.keepDefectPhotos, url => {
      state.keepDefectPhotos = state.keepDefectPhotos.filter(u => u !== url);
      renderItemPhotos(card, state);
    });
    const newPreview = card.querySelector('.it-photo-preview');
    newPreview.innerHTML = '';
    state.files.forEach(file => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      newPreview.appendChild(img);
    });
    const newDefectPreview = card.querySelector('.it-defect-preview');
    newDefectPreview.innerHTML = '';
    state.defectFiles.forEach(file => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      newDefectPreview.appendChild(img);
    });
  }

  // 화면에 그려진 순서대로 품목 값을 모은다. 사진 파일은 상태에서 가져온다.
  function collectItemEntries() {
    return Array.from(document.querySelectorAll('#itemsWrap .item-card')).map(card => {
      const state = itemStates.find(s => s.uid === card.dataset.uid);
      const result = card.querySelector('.it-result').value;
      return {
        state,
        values: {
          itemName: card.querySelector('.it-name').value.trim(),
          color: card.querySelector('.it-color').value.trim(),
          lotNo: card.querySelector('.it-lot').value.trim(),
          quantity: card.querySelector('.it-qty').value || '',
          result,
          defectDetail: result === '적합' ? '' : card.querySelector('.it-defect').value.trim(),
          remarks: card.querySelector('.it-remarks').value.trim(),
          keepPhotos: state.keepPhotos,
          keepDefectPhotos: state.keepDefectPhotos
        }
      };
    }).filter(entry => entry.values.itemName);
  }

  const MAX_PHOTO_MB = 100;

  // 사진을 실제로 한 조각 읽어 본다. USB/네트워크 드라이브가 빠졌거나 파일이 옮겨졌으면 여기서 걸린다.
  async function checkPhotosBeforeUpload(entries, status) {
    for (let index = 0; index < entries.length; index += 1) {
      const files = [...entries[index].state.files, ...entries[index].state.defectFiles];
      for (const file of files) {
        const sizeMb = file.size / 1024 / 1024;
        if (sizeMb > MAX_PHOTO_MB) {
          throw new Error(
            `사진 "${file.name}" 의 용량이 ${sizeMb.toFixed(1)}MB 로 너무 큽니다. ` +
            `한 장당 ${MAX_PHOTO_MB}MB 까지 올릴 수 있습니다.`
          );
        }
        try {
          await file.slice(0, 1).arrayBuffer();
        } catch {
          throw new Error(
            `사진 "${file.name}" 을 읽을 수 없습니다. ` +
            '파일이 옮겨졌거나 USB·SD카드·네트워크 드라이브가 분리된 것 같습니다. ' +
            '사진을 이 PC로 복사한 뒤 다시 선택해 주세요.'
          );
        }
      }
    }
    const totalMb = entries.reduce((sum, entry) =>
      sum + [...entry.state.files, ...entry.state.defectFiles].reduce((s, f) => s + f.size, 0), 0) / 1024 / 1024;
    if (totalMb > 5) {
      status.textContent = `사진 ${totalMb.toFixed(1)}MB 를 올리는 중입니다. 잠시만 기다려 주세요...`;
    }
  }

  // fetch 가 실패하면 브라우저는 "Failed to fetch" 라고만 알려 준다. 무엇을 확인해야 하는지 덧붙인다.
  function describeSaveError(err) {
    const message = (err && err.message) || '알 수 없는 오류';
    if (/failed to fetch|networkerror|load failed/i.test(message)) {
      return '서버에 연결하지 못했습니다. ' +
        '(1) 검은색 서버 창이 켜져 있는지 확인해 주세요. ' +
        '(2) 사진이 USB·SD카드에 있다면 PC로 복사한 뒤 다시 선택해 주세요.';
    }
    return message;
  }

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    const status = document.getElementById('registerStatus');
    submitBtn.disabled = true;
    status.className = 'status-msg info';
    status.textContent = '등록 중입니다...';

    try {
      const entries = collectItemEntries();
      if (!entries.length) throw new Error('품목을 1개 이상 입력해 주세요.');
      await checkPhotosBeforeUpload(entries, status);

      const formData = new FormData();
      formData.append('inspectionDate', document.getElementById('iDate').value);
      formData.append('vendor', document.getElementById('iVendor').value.trim());
      formData.append('inspector', document.getElementById('iInspector').value.trim());
      formData.append('inspectionItem', document.getElementById('iInspectionItem').value.trim());
      formData.append('criteria', document.getElementById('iCriteria').value.trim());
      formData.append('requestDocUrl', document.getElementById('iRequestDocUrl').value.trim());
      formData.append('reportDocUrl', document.getElementById('iReportDocUrl').value.trim());
      formData.append('remarks', document.getElementById('iRemarks').value.trim());
      formData.append('items', JSON.stringify(entries.map(entry => entry.values)));
      // 사진은 품목 순서에 맞춰 photos_0, photos_1 ... 이름으로 올린다.
      entries.forEach((entry, index) => {
        entry.state.files.forEach(file => formData.append(`photos_${index}`, file));
        entry.state.defectFiles.forEach(file => formData.append(`defectPhotos_${index}`, file));
      });

      let res;
      if (editingId) {
        res = await fetch(`/api/inspections/${editingId}`, { method: 'PUT', body: formData });
      } else {
        res = await fetch('/api/inspections', { method: 'POST', body: formData });
      }
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.error || '서버 응답 오류 (' + res.status + ')');
      }

      status.className = 'status-msg info';
      status.textContent = editingId ? '수정되었습니다.' : '등록되었습니다.';
      await loadData();
      await loadScheduled();
      setTimeout(closeRegisterModal, 600);
    } catch (err) {
      status.className = 'status-msg error';
      status.textContent = '등록 실패: ' + describeSaveError(err);
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

<script>
  // 공개 페이지에는 서버가 없다. 실수로 눌리더라도 안내만 하고 아무 일도 일어나지 않게 한다.
  [
    'openRegisterModal', 'openEditModal', 'duplicateRecord', 'deleteRecord',

    window[name] = function () {
      alert('이 페이지는 조회 전용입니다.\n등록과 수정은 사내 검사성적서 프로그램에서 해주세요.');
    };
  });
</script>
